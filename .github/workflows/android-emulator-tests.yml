name: Android emulator instrumentation tests

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-emulator-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-instrumentation:
    name: Android API ${{ matrix.api-level }} / account-free UI tests
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Reserve disk for API36 userdata
        if: matrix.api-level == 36
        run: |
          # These preinstalled toolchains are unused by this Kotlin/JVM Android build.
          sudo rm -rf /usr/share/dotnet "${ANDROID_HOME:?}/ndk"
          df -h .

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run account-free Android UI and lifecycle instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Host-only hold methods must never enter normal discovery (no suite skips).
          script: |
            (cd android && chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest)
            # Fresh synthetic images can show a Pixel Launcher ANR during compilation.
            # Clear only that launcher before tests; never suppress Health App failures.
            adb shell am force-stop com.google.android.apps.nexuslauncher
            (cd android && chmod +x gradlew && ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.ny.my.health.HistoryProcessRecoveryInstrumentedTest)
            bash android/ci/verify-history-process-recovery.sh

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-reports-api${{ matrix.api-level }}
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/**/v1-synthetic-ui/*.png
            android/app/build/outputs/v1-synthetic-process/system-*.png
            android/app/build/outputs/v1-synthetic-process/results.txt
          if-no-files-found: warn
          retention-days: 14
