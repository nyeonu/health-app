name: Android emulator instrumentation tests

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-emulator-tests.yml'
  workflow_dispatch:
    inputs:
      test_scope:
        description: '테스트 범위: starter는 기반 기동 진단이며 전체 회귀 검증이 아님'
        type: choice
        default: full
        options:
          - full
          - saf-provider-starter

permissions:
  contents: read

jobs:
  emulator-instrumentation:
    name: Android API ${{ matrix.api-level }} / account-free UI tests
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: API 35·36 에뮬레이터 userdata 디스크 공간 확보
        run: |
          # These preinstalled toolchains are unused by this Kotlin/JVM Android build.
          sudo rm -rf /usr/share/dotnet "${ANDROID_HOME:?}/ndk"
          df -h .

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 컴파일용 Android SDK 36 준비
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: 에뮬레이터 부팅 전 테스트 APK 빌드
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run account-free Android UI and lifecycle instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_SCOPE: ${{ inputs.test_scope }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Host-only hold methods must never enter normal discovery (no suite skips).
          script: |
            # 계정 없는 테스트에서 사용하지 않는 SDK 설정 패키지가 있으면 한 번 종료한다.
            if adb shell pm list packages com.google.android.googlesdksetup | tr -d '\r' | grep -Fxq 'package:com.google.android.googlesdksetup'; then adb shell am force-stop com.google.android.googlesdksetup; fi
            # 테스트 전 기존 launcher 종료를 유지하며 ANR 대화상자 해소는 보장하지 않는다.
            adb shell am force-stop com.google.android.apps.nexuslauncher
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$TEST_SCOPE" = "saf-provider-starter" ]; then
              # 기반 기동 진단 전용이며 전체 회귀 통과를 뜻하지 않는다.
              (cd android && chmod +x gradlew && ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ny.my.health.SyntheticProviderStarterTest)
            else
              (cd android && chmod +x gradlew && ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.ny.my.health.HistoryProcessRecoveryInstrumentedTest,com.ny.my.health.SyncStateProcessRecoveryInstrumentedTest)
              bash android/ci/verify-history-process-recovery.sh
              bash android/ci/verify-sync-state-process-recovery.sh
            fi

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-reports-api${{ matrix.api-level }}
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/**/v1-synthetic-ui/*.png
            android/app/build/outputs/**/v1-synthetic-store-performance/*.json
            android/app/build/outputs/v1-synthetic-process/system-*.png
            android/app/build/outputs/v1-synthetic-process/results.txt
            android/app/build/outputs/v1-synthetic-sync-state-process/results.txt
          if-no-files-found: warn
          retention-days: 14
