name: Android emulator instrumentation tests

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-emulator-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-instrumentation:
    name: Android 15 emulator / account-free UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run account-free Android UI and lifecycle instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Host-only hold methods must never enter normal discovery (no suite skips).
          script: |
            (cd android && chmod +x gradlew && ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.ny.my.health.HistoryProcessRecoveryInstrumentedTest)
            bash android/ci/verify-history-process-recovery.sh

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-reports
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/**/v1-synthetic-ui/*.png
            android/app/build/outputs/v1-synthetic-process/system-*.png
            android/app/build/outputs/v1-synthetic-process/results.txt
          if-no-files-found: warn
          retention-days: 14
